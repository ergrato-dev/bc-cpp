<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img"
     aria-label="La pila de llamadas en tres instantes. Izquierda: main ha llamado a parse y parse a read_int; hay tres marcos apilados, cada uno con sus variables locales. Centro: read_int ha hecho return y su marco ha desaparecido; el valor devuelto se copió al marco de parse. Derecha: si read_int hubiera devuelto una referencia a su variable local, esa referencia apuntaría a un marco que ya no existe: referencia colgante.">
  <title>La pila de llamadas: los marcos nacen en la llamada y mueren en el return</title>
  <style>
    .bg   { fill: #0d1117; }
    .t    { font-family: Inter, Roboto, "Segoe UI", system-ui, sans-serif; }
    .code { font-family: ui-monospace, "JetBrains Mono", Consolas, monospace; fill: #79c0ff; font-size: 12px; }
    .h    { font-size: 15px; font-weight: 600; fill: #e6edf3; }
    .s    { font-size: 12px; fill: #8b949e; }
    .lbl  { font-size: 12px; fill: #e6edf3; }
    .col  { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .fr   { fill: #0d2310; stroke: #4ade80; stroke-width: 1.5; }
    .frd  { fill: none; stroke: #f85149; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .fn   { font-family: ui-monospace, "JetBrains Mono", Consolas, monospace; font-size: 13px; font-weight: 600; fill: #4ade80; }
    .fnd  { font-family: ui-monospace, "JetBrains Mono", Consolas, monospace; font-size: 13px; font-weight: 600; fill: #f85149; }
    .ok   { fill: #3fb950; }
    .err  { fill: #f85149; }
    .ar   { stroke: #8b949e; stroke-width: 1.5; fill: none; marker-end: url(#m); }
    .are  { stroke: #f85149; stroke-width: 1.5; fill: none; marker-end: url(#me); }
  </style>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="me" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f85149"/>
    </marker>
  </defs>
  <rect class="bg" width="880" height="440" rx="12"/>
  <text class="t h" x="440" y="34" text-anchor="middle">La pila de llamadas: cada llamada apila un marco, cada return lo desapila</text>
  <text class="t s" x="440" y="54" text-anchor="middle">main() llama a parse(line), que llama a read_int(text). La pila crece hacia arriba en el dibujo.</text>

  <!-- Instante 1 -->
  <rect class="col" x="24" y="74" width="266" height="342" rx="10"/>
  <text class="t lbl" x="157" y="98" text-anchor="middle">1 · dentro de read_int</text>
  <rect class="fr" x="44" y="112" width="226" height="78" rx="6"/>
  <text class="fn" x="54" y="130">read_int</text>
  <text class="code" x="54" y="150">text  = "42"</text>
  <text class="code" x="54" y="168">value = 42</text>
  <text class="t s" x="180" y="130">← se ejecuta</text>
  <rect class="fr" x="44" y="198" width="226" height="78" rx="6"/>
  <text class="fn" x="54" y="216">parse</text>
  <text class="code" x="54" y="236">line = "add 42"</text>
  <text class="code" x="54" y="254">count = ?</text>
  <text class="t s" x="180" y="216">espera</text>
  <rect class="fr" x="44" y="284" width="226" height="78" rx="6"/>
  <text class="fn" x="54" y="302">main</text>
  <text class="code" x="54" y="322">line = "add 42"</text>
  <text class="code" x="54" y="340">items = {...}</text>
  <text class="t s" x="180" y="302">espera</text>
  <text class="t s" x="157" y="396" text-anchor="middle">Tres marcos vivos. value existe.</text>

  <!-- Instante 2 -->
  <rect class="col" x="307" y="74" width="266" height="342" rx="10"/>
  <text class="t lbl" x="440" y="98" text-anchor="middle">2 · read_int hace return value;</text>
  <rect class="frd" x="327" y="112" width="226" height="50" rx="6"/>
  <text class="fnd" x="337" y="130">read_int</text>
  <text class="t s" x="337" y="150">marco liberado · value ya no existe</text>
  <path class="ar" d="M470,164 L470,194"/>
  <text class="t s ok" x="480" y="184">copia de 42</text>
  <rect class="fr" x="327" y="198" width="226" height="78" rx="6"/>
  <text class="fn" x="337" y="216">parse</text>
  <text class="code" x="337" y="236">line = "add 42"</text>
  <text class="code" x="337" y="254">count = 42</text>
  <rect class="fr" x="327" y="284" width="226" height="78" rx="6"/>
  <text class="fn" x="337" y="302">main</text>
  <text class="code" x="337" y="322">line = "add 42"</text>
  <text class="code" x="337" y="340">items = {...}</text>
  <text class="t s ok" x="440" y="384" text-anchor="middle">Devolver por valor: el 42 sale</text>
  <text class="t s ok" x="440" y="402" text-anchor="middle">antes de que el marco muera</text>

  <!-- Instante 3 -->
  <rect class="col" x="590" y="74" width="266" height="342" rx="10"/>
  <text class="t lbl" x="723" y="98" text-anchor="middle">3 · si devolviera int&amp; value</text>
  <rect class="frd" x="610" y="112" width="226" height="78" rx="6"/>
  <text class="fnd" x="620" y="130">read_int</text>
  <text class="t s" x="620" y="150">marco liberado</text>
  <text class="t s err" x="620" y="168">la memoria ya no es de nadie</text>
  <path class="are" d="M816,250 L816,176"/>
  <rect class="fr" x="610" y="198" width="226" height="78" rx="6"/>
  <text class="fn" x="620" y="216">parse</text>
  <text class="code" x="620" y="236">line = "add 42"</text>
  <text class="code" x="620" y="254">int&amp; count</text>
  <text class="t s err" x="712" y="254">← colgante</text>
  <rect class="fr" x="610" y="284" width="226" height="78" rx="6"/>
  <text class="fn" x="620" y="302">main</text>
  <text class="code" x="620" y="322">line = "add 42"</text>
  <text class="code" x="620" y="340">items = {...}</text>
  <text class="t s err" x="723" y="384" text-anchor="middle">UB. GCC: -Wreturn-local-addr</text>
  <text class="t s err" x="723" y="402" text-anchor="middle">ASan: stack-use-after-return</text>
</svg>
